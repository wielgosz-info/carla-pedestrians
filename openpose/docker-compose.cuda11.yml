version: "3.9"
services:
  openpose:
    image: carla-pedestrians-openpose-cuda11:latest
    runtime: nvidia
    user: "${USER_ID}:${GROUP_ID}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${OPENPOSE_DATASETS_PATH}:/datasets  # REMOVED :ro to allow writing
      - ${PWD}:/app
      - vscode:/home/carla-pedestrians-openpose/.vscode-server
      - vscode-insiders:/home/carla-pedestrians-openpose/.vscode-server-insiders
      - ${OPENPOSE_OUTPUTS_DIR_OR_VOLUME}:/outputs
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    command: tail -f /dev/null
volumes:
  vscode:
  vscode-insiders:
